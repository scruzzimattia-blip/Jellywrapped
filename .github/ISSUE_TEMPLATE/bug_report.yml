name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: jellyfin-version
    attributes:
      label: Jellyfin version
      placeholder: e.g. 10.9.11
    validations:
      required: true

  - type: dropdown
    id: tracearr
    attributes:
      label: Are you using Tracearr?
      options:
        - "Yes"
        - "No — direct Jellyfin API"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Firefox 126 on macOS 14
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console logs / errors
      description: Paste any browser console errors here.
      render: shell
